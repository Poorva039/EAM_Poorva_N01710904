<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Patient Form</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="header">Hospital Management System - Patients</div>
<div class="container">
    <h2 th:text="${pageTitle}"></h2>

    <form th:if="${patient.id == null}" th:action="@{/patients/save}" th:object="${patient}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{patientName}" required>

        <label>Mobile</label>
        <input type="text" th:field="*{mobile}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Address</label>
        <input type="text" th:field="*{address}" required>

        <label>Username</label>
        <input type="text" th:field="*{username}" required>

        <label>Password</label>
        <input type="password" th:field="*{password}" required>

        <button type="submit" class="btn">Save</button>
        <a th:href="@{/patients}" class="btn">Back</a>
    </form>

    <form th:if="${patient.id != null}" th:action="@{/patients/save}" th:object="${patient}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Name</label>
        <input type="text" th:field="*{patientName}" required>

        <label>Mobile</label>
        <input type="text" th:field="*{mobile}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Address</label>
        <input type="text" th:field="*{address}" required>

        <label>Username</label>
        <input type="text" th:field="*{username}" required>

        <label>Password</label>
        <input type="password" th:field="*{password}" required>

        <button type="submit" class="btn">Update</button>
        <a th:href="@{/patients}" class="btn">Back</a>
    </form>
</div>
</body>
</html>
